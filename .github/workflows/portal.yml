# Publica en GitHub Pages el portal de clientes, la carga rápida desde el celular
# y la app completa del taller en el navegador:
# https://joaquincabrera2510jc-hue.github.io/taller-pepe/
name: Publicar portal de clientes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["portal/**", "src/**", "build/armar-web.sh", ".github/workflows/portal.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: bash build/armar-web.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
