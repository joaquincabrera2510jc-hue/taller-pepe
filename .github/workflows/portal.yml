# Publica la página web de clientes (carpeta portal/) en GitHub Pages:
# https://joaquincabrera2510jc-hue.github.io/taller-pepe/
name: Publicar portal de clientes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["portal/**", ".github/workflows/portal.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal
      - id: deployment
        uses: actions/deploy-pages@v4
